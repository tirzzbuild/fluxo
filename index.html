async function hash(s){
  try{ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("badak:"+s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("") }
  catch(e){ let h=5381; for(const c of "badak:"+s) h=((h<<5)+h)+c.charCodeAt(0); return "f"+(h>>>0).toString(16) }
}

}

function normNum(raw){
  const s=String(raw).trim(),plus=s.startsWith("+");
  let d=s.replace(/\D/g,"");
  if(!d) return null;
  if(d.startsWith("0")) d="62"+d.slice(1);
  else if(!plus&&d.startsWith("8")) d="62"+d;
  if(d.startsWith("62")){
    const sub=d.slice(2);
    if(sub.length<9||sub.length>12||sub[0]!=="8") return null;
    return {sub,full:d,id:true};
  }
  if(d.length<8||d.length>15) return null;
  return {sub:d,full:d,id:false};
}
const fmtNum=n=>n.id?`+62 ${n.sub.slice(0,3)}-${n.sub.slice(3,7)}-${n.sub.slice(7)}`:`+${n.full}`;

function analyze(sub){
  const dg=sub.split("").map(Number);
  let maxRun=1,run=1,asc=1,desc=1,seq=1;
  for(let i=1;i<dg.length;i++){
    run=dg[i]===dg[i-1]?run+1:1;maxRun=Math.max(maxRun,run);
    asc=dg[i]===dg[i-1]+1?asc+1:1;desc=dg[i]===dg[i-1]-1?desc+1:1;seq=Math.max(seq,asc,desc);
  }
  const uniq=new Set(dg).size,tl=sub.slice(-4),rev=x=>x.split("").reverse().join("");
  let tail=0,tailKey="t_rand";
  if(/^(\d)\1{3}$/.test(tl)){tail=100;tailKey="t_4"}
  else if(/^(\d)\1(\d)\2$/.test(tl)){tail=85;tailKey="t_aabb"}
  else if(/^(\d)(\d)\1\2$/.test(tl)){tail=80;tailKey="t_abab"}
  else if(/^(\d)(\d)\2\1$/.test(tl)){tail=75;tailKey="t_abba"}
  else if(/(\d)\1\1$/.test(sub)){tail=65;tailKey="t_3"}
  else if(/00$/.test(tl)){tail=55;tailKey="t_00"}
  else if(/(\d)\1$/.test(sub)){tail=35;tailKey="t_2"}
  const l6=sub.slice(-6);
  const sym=l6===rev(l6)?90:(tl===rev(tl)?60:0);
  const rep=Math.min(100,(maxRun-1)*30+Math.max(0,8-uniq)*12);
  const seqS=seq>=3?Math.min(100,(seq-2)*35):0;
  const score=Math.round(Math.min(100,12+rep*.28+seqS*.22+tail*.34+sym*.16));
  const tier=score<30?0:score<50?1:score<70?2:score<85?3:4;
  return {score,tier,rep,seq:seqS,tail,tailKey,sym,uniq,maxRun};
}

function ageText(d){
  const y=Math.floor(d/365),m=Math.floor((d%365)/30);
  return y>0?t("age_ym",{y,m}):m>0?t("age_md",{m,d:d%30}):t("age_d",{d});
}
async function fetchAge(n){
  const u=CONFIG.api&&CONFIG.api.umurNomor;
  if(!u) return {state:"noapi"};
  try{
    const ctl=new AbortController();setTimeout(()=>ctl.abort(),8000);
    const r=await fetch(u.replace("{nomor}",encodeURIComponent(n.full)),{signal:ctl.signal});
    const d=await r.json();
    let days=d.age_days!=null?d.age_days:d.umur_hari;
    const since=d.since||d.registered||d.terdaftar;
    if(days==null&&since){const tm=new Date(since).getTime();if(!isNaN(tm)) days=Math.floor((Date.now()-tm)/864e5)}
    return days==null?{state:"empty"}:{state:"ok",days:Math.max(0,+days)};
  }catch(e){return {state:"err"}}
}

/* ---------------- BADAKIN ---------------- */
let BK={num:"",running:false,out:null};
function bkView(){
  return `${backBtn()}<div class="sec"><h3>${t("bk_title")}</h3><span class="pill">${t("bk_pill")}</span></div>
  <div class="box"><input id="kn" inputmode="tel" placeholder="${esc(t("num_ph"))}" value="${esc(BK.num)}" onkeydown="if(event.key==='Enter')bkRun()">
  <div class="err" id="kerr"></div><button class="btn" id="kgo" onclick="bkRun()">${t("bk_go")}</button>
  <div id="kprog" style="display:none"><div class="bar"><i id="kbar"></i></div><div class="term" id="klog"></div></div></div>
  <div id="kres">${BK.out?bkResult(BK.out):""}</div>`;
}
function bkResult(o){
  return `<div class="box pop"><span class="pill">${t("bk_done")}</span><h3 style="margin:10px 0 2px">${esc(fmtNum(o.n))}</h3><p style="color:var(--mut);font-size:13px">${esc(opText(o.n))}</p><div class="age" style="margin-top:12px">${esc(o.key?t(o.key):o.msg)}</div></div>`;
}
const BK_STEPS=[[["Starting up services","Memulai layanan"],500],[["Connecting to server","Menghubungkan ke server"],700],[["Setting things up","Menyiapkan sistem"],900],[["Loading new components","Memuat komponen baru"],500],[["Adding Bypass trinity","Menambahkan Bypass trinity"],800],[["Data is being processed","Data sedang diproses"],900],[["Patience is in progress","Mohon bersabar, sedang berjalan"],400],[["Analyzing incoming data","Menganalisis data masuk"],900],[["Updating internal components","Memperbarui komponen internal"],800],[["Good things are on the way","Hal baik sedang dalam perjalanan"],700]];
async function bkRun(){
  if(BK.running) return;
  const inp=$("#kn"),err=$("#kerr");BK.num=inp.value;err.textContent="";
  const n=normNum(inp.value);
  if(!n){err.textContent=t("num_bad");return}
  BK.running=true;BK.out=null;$("#kres").innerHTML="";
  const btn=$("#kgo");btn.textContent=t("working");btn.style.opacity=".6";
  const prog=$("#kprog"),bar=$("#kbar"),log=$("#klog");prog.style.display="block";log.innerHTML="";bar.style.width="0";
  let msg="",key="bk_ok",ok=false;
  for(let i=0;i<BK_STEPS.length;i++){
    const lb=L(BK_STEPS[i][0]);
    const d=document.createElement("div");d.innerHTML=`<span class="dim">&gt;</span> ${esc(lb)}...`;log.appendChild(d);
    bar.style.width=((i+.5)/BK_STEPS.length*100)+"%";
    if(i===2&&CONFIG.api.badakin){
      try{
        const ctl=new AbortController();setTimeout(()=>ctl.abort(),20000);
        const r=await fetch(CONFIG.api.badakin.replace("{nomor}",encodeURIComponent(n.full)),{signal:ctl.signal});
        const tx=await r.text();let j;try{j=JSON.parse(tx)}catch(e){j={pesan:tx}}
        msg=String(j.pesan||j.message||j.status||tx).slice(0,300);key="";ok=r.ok;
      }catch(e){key="bk_srv"}
    }
    await sleep(BK_STEPS[i][1]);
    d.innerHTML=`<span class="ok">OK</span> ${esc(lb)}`;
    bar.style.width=((i+1)/BK_STEPS.length*100)+"%";
  }
  await sleep(250);
  BK.out={ok,msg,key,n};
  BK.running=false;btn.textContent=t("bk_go");btn.style.opacity="1";prog.style.display="none";
  $("#kres").innerHTML=bkResult(BK.out);
}

/* ---------------- VIEWS FITUR ---------------- */
Object.assign(views,{
badakin(){return bkView()},
cek(){
  return `${backBtn()}<div class="sec"><h3>${t("ck_title")}</h3><span class="pill">${t("ck_pill")}</span></div>
  <div class="box"><input id="bn" inputmode="tel" placeholder="${esc(t("num_ph"))}" value="${esc(bd.num)}" onkeydown="if(event.key==='Enter')badakScan()">

  <div id="bres">${bd.res?badakResult(bd.res):""}</div>`;
},

  return `${backBtn()}<div class="sec"><h3>${t("sh_title")}</h3><span class="pill">${t("sh_pill")}</span></div>${cityBox()}${shellState()}${SH.data?nextCard():""}${rows}`;
},
adzan(){
  return `${backBtn()}<div class="sec"><h3>${t("ad_title")}</h3><span class="pill">${AD.on?t("on"):t("off")}</span></div>
  ${cityBox()}${shellState()}${SH.data?nextCard():""}

  <button class="btn ${AD.on?"red":""}" onclick="toggleAdzan()">${AD.on?t("ad_off"):t("ad_on")}</button>
  </div>
  <div class="box"><b>${t("ad_pick")}</b><div class="chips" style="flex-wrap:wrap;margin-top:10px">${PR.map(k=>`<button class="chip ${AD.p[k]?"on":""}" onclick="togglePr('${k}')">${pnm(k)}${SH.data?" · "+hm(SH.data[k]):""}</button>`).join("")}</div>
  <button class="btn" style="margin-top:6px" onclick="if(!AD.audio)mkAudio();fireAdzan('Dhuhr',t('ad_testT'))">${t("ad_test")}</button></div>`;
},
toko(){return TK.sel?tokoCheckout():`${backBtn()}${tokoList()}`}
});

setupApp();
initDB().then(render);
</script>
